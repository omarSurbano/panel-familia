<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel Familiar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f1419; color: #e8eef5;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s ease;
  }

  /* MODO CINE (Fondo oscuro) */
  body.cine-mode { background: #000000; }
  body.cine-mode .card, body.cine-mode .top-row { opacity: 0.1; pointer-events: none; }
  body.cine-mode .face-container { opacity: 1; pointer-events: auto; margin: 0 auto; }
  
  .cinema-timer {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    justify-content: center; align-items: center; flex-direction: column; z-index: 100;
    color: #fff; text-align: center;
  }
  body.cine-mode .cinema-timer { display: flex; }
  .cinema-timer h1 { font-size: 120px; font-weight: 300; font-variant-numeric: tabular-nums; margin-bottom: 20px;}
  .cinema-timer p { font-size: 30px; color: #8aa2bd; }
  .cinema-timer button {
    margin-top: 40px; padding: 15px 30px; font-size: 20px; border-radius: 10px;
    background: #ef4444; color: white; border: none; cursor: pointer;
  }

  .panel { display: grid; grid-template-rows: auto 1fr; height: 100vh; padding: 14px; gap: 12px; }

  /* Fila superior */
  .top-row {
    display: grid; grid-template-columns: auto 1fr auto auto; 
    align-items: center; gap: 20px;
    background: linear-gradient(135deg, #1a2332 0%, #141b26 100%);
    border-radius: 14px; padding: 14px 22px; border: 1px solid #253142;
    transition: opacity 0.5s;
  }

  /* CARITA */
  .face-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face-container {
    width: 80px; height: 80px; background: #facc15; border-radius: 50%;
    position: relative; display: flex; justify-content: center; align-items: center;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1); transition: background 0.5s, transform 0.3s;
    cursor: pointer;
  }
  .face-container:active { transform: scale(0.95); }
  .face-container.manana { background: #fbbf24; } 
  .face-container.tarde { background: #facc15; } 
  .face-container.noche { background: #818cf8; }
  body.cine-mode .face-container { background: #facc15; animation: dance 1s infinite alternate; }
  
  .eyes { display: flex; gap: 18px; position: absolute; top: 25px; }
  .eye { width: 10px; height: 15px; background: #1a2332; border-radius: 50%; animation: blink 4s infinite; transform-origin: center; }
  .mouth { width: 28px; height: 10px; background: #1a2332; border-radius: 0 0 30px 30px; position: absolute; bottom: 18px; transition: all 0.2s ease; }
  .face-container.speaking .mouth { height: 20px; width: 20px; border-radius: 50%; bottom: 14px; animation: talk 0.3s infinite alternate; }
  
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
  @keyframes talk { 0% { height: 15px; } 100% { height: 25px; } }
  @keyframes dance { 0% { transform: translateY(0) rotate(-10deg); } 100% { transform: translateY(-15px) rotate(10deg); } }

  .btn-hola {
    background: #3b82f6; color: white; border: none; border-radius: 20px;
    padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: background 0.2s;
  }
  .btn-hola:active { background: #2563eb; }

  /* RELOJ */
  .clock-block { text-align: center; }
  .clock-block .clock { font-size: 75px; font-weight: 300; letter-spacing: -2px; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums; }
  .clock-block .clock .seconds { font-size: 30px; color: #6b87a8; }
  .clock-block .date { font-size: 18px; color: #8aa2bd; margin-top: 4px; text-transform: capitalize; }

  /* CLIMA Y BOTÓN CINE */
  .weather-block { text-align: right; min-width: 140px; display: flex; align-items: center; justify-content: flex-end; gap: 15px; }
  .weather-info .temp { font-size: 50px; font-weight: 300; color: #ffffff; line-height: 1; }
  .weather-info .temp .unit { font-size: 24px; color: #8aa2bd; vertical-align: top; }
  .weather-info .desc { font-size: 15px; color: #8aa2bd; text-transform: capitalize; margin-top: 2px; }
  .weather-info .city { font-size: 12px; color: #55687d; }
  
  .btn-cine { font-size: 28px; background: none; border: none; cursor: pointer; filter: grayscale(1); opacity: 0.7; transition: 0.3s; }
  .btn-cine:hover, .btn-cine:active { filter: grayscale(0); opacity: 1; transform: scale(1.1); }

  /* BATERÍA */
  .battery-block { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 40px; }
  .battery-icon { width: 30px; height: 14px; border: 2px solid #8aa2bd; border-radius: 3px; position: relative; padding: 2px; }
  .battery-icon::after { content: ''; position: absolute; right: -5px; top: 3px; width: 3px; height: 6px; background: #8aa2bd; border-radius: 0 2px 2px 0; }
  .battery-level { height: 100%; background: #4ade80; border-radius: 1px; transition: width 0.5s, background 0.5s; }
  .battery-text { font-size: 11px; color: #8aa2bd; font-weight: bold; }

  /* Fila inferior */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; min-height: 0; }
  .card { background: linear-gradient(135deg, #1a2332 0%, #141b26 100%); border-radius: 14px; padding: 12px 16px; border: 1px solid #253142; display: flex; flex-direction: column; min-height: 0; overflow: hidden; transition: opacity 0.5s; }
  .card-title { font-size: 15px; font-weight: 600; color: #6b87a8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #253142; flex-shrink: 0; }

  /* Eventos */
  .events-list { list-style: none; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .events-list::-webkit-scrollbar { width: 4px; }
  .events-list::-webkit-scrollbar-thumb { background: #253142; border-radius: 2px; }
  .event-item { display: grid; grid-template-columns: 65px 1fr; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed #1f2a3a; }
  .event-item:last-child { border-bottom: none; }
  .event-time { font-size: 13px; color: #6b87a8; font-variant-numeric: tabular-nums; }
  .event-time .day { display: block; font-size: 11px; color: #4a6079; text-transform: capitalize; }
  .event-title { font-size: 16px; color: #e8eef5; line-height: 1.2; word-break: break-word; }
  .event-item.all-day .event-time { color: #e0a94a; }
  .empty { color: #55687d; font-size: 15px; padding: 10px 0; font-style: italic; }

  /* Notas y Chistes */
  .notes-area { flex: 1; width: 100%; background: #0b1016; color: #e8eef5; border: 1px solid #253142; border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.4; font-family: inherit; resize: none; outline: none; min-height: 0; transition: border-color 0.3s; }
  .notes-area:focus { border-color: #3b82f6; }
  .notes-hint { font-size: 11px; color: #4a6079; margin-top: 4px; text-align: right; flex-shrink: 0; transition: color 0.3s; }
  .notes-hint.saved { color: #4ade80; }
  
  .chiste-box { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #253142; font-size: 14px; color: #fbbf24; font-style: italic; text-align: center; }

  @media (max-width: 800px) {
    .top-row { grid-template-columns: auto 1fr auto; padding: 10px; gap: 10px; }
    .battery-block { display: none; }
    .clock-block .clock { font-size: 55px; }
    .clock-block .clock .seconds { font-size: 25px; }
    .clock-block .date { font-size: 15px; }
    .weather-info .temp { font-size: 38px; }
    .weather-info .desc, .weather-info .city { font-size: 12px; }
    .face-container { width: 60px; height: 60px; }
    .eyes { top: 18px; gap: 12px; }
    .eye { width: 8px; height: 12px; }
    .mouth { bottom: 12px; width: 20px; height: 8px; }
  }
</style>
</head>
<body>

<!-- Modo Cine (Oculto por defecto) -->
<div class="cinema-timer" id="cinema-timer">
  <h1 id="timer-display">02:00:00</h1>
  <p>Modo Cine activado 🍿</p>
  <button onclick="toggleCine()">Salir del Modo Cine</button>
</div>

<div class="panel">
  <div class="top-row">
    
    <!-- Carita y Botón Hola -->
    <div class="face-wrapper">
      <div class="face-container" id="face" onclick="decirHola()">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <button class="btn-hola" onclick="decirHola()">¡Hola!</button>
    </div>

    <div class="clock-block">
      <div class="clock" id="clock">--:--<span class="seconds">:--</span></div>
      <div class="date" id="date">cargando...</div>
    </div>

    <div class="weather-block">
      <div class="weather-info">
        <div class="temp"><span id="temp">--</span><span class="unit">°C</span></div>
        <div class="desc" id="weather-desc">Cargando...</div>
        <div class="city" id="city-name"></div>
      </div>
      <button class="btn-cine" onclick="toggleCine()" title="Modo Cine">🎬</button>
    </div>

    <div class="battery-block">
      <div class="battery-icon"><div class="battery-level" id="battery-level" style="width: 100%;"></div></div>
      <div class="battery-text" id="battery-text">--%</div>
    </div>
  </div>

  <div class="bottom-row">
    <div class="card">
      <div class="card-title">Próximos eventos</div>
      <ul class="events-list" id="events-list"><li class="empty">Cargando calendario...</li></ul>
    </div>

    <div class="card">
      <div class="card-title">Notas familiares</div>
      <textarea class="notes-area" id="notes" placeholder="Escribe aquí..."></textarea>
      <div class="notes-hint" id="notes-hint">Se guardan automáticamente</div>
      <div class="chiste-box" id="chiste-box"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
var ICS_URL = 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent('https://calendar.zoho.eu/ical/0801124aaacfb956572a96ba7aff45bc0000299d45a5771512967b2d8f19afec8253e8336b5ce1ce89cf81f6dc8b643ac7f8e1cf49b45c1ca4245a0ef6cd28a117efee958e7a652117409e68ad41');
var LAT = 44.8150;
var LON = 7.2450;
var CIUDAD = 'Luserna San Giovanni';
var AVISO_MIN = 15;

/* ============================================================ */

var DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
var MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
var DIAS_CORTOS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];

// ---------- CHISTES ----------
var CHISTES = [
  "¿Sabes cuál es el café más peligroso? El ex-preso.",
  "Aro, aro, aro... ¿Quién quiere que le cuente un chiste?",
  "Jaimito, ¿qué es un polígono? Pues un loro policía.",
  "¿Cómo se llama el primo de un pez? El pez primo.",
  "¿Qué le dice un semáforo a otro? No me mires que me estoy cambiando.",
  "Jaimito, ¿qué es la A? - La vecina del abecedario.",
  "¿Cuál es el animal que tiene más dientes? El ratón Pérez.",
  "Jaimito, ¿qué es un hámster? - Un hamster... pero en grande.",
  "¿Por qué las jirafas tienen el cuello largo? Porque huelen muy mal los pies.",
  "Aro, aro, aro... ¿Qué hace un pez en el agua? Pues nadar.",
  "¿Qué le dice una pared a otra? Nos vemos en la esquina.",
  "Jaimito, ¿qué es una tontería? - Pues un tonel muy pequeño.",
  "¿Cómo se llama el campeón de buceo más pequeño del mundo? Pulgarcito.",
  "¿Qué hace una abeja en el gimnasio? Zumba.",
  "Jaimito, ¿por qué llega tarde a clase? - Porque el cartel de la escuela decía 'Cuidado con los niños'.",
  "¿Qué es un fantasma que no da miedo? Un fantasma respetuoso.",
  "¿Cómo se llama el hermano del pan? El pancito.",
  "Jaimito, ¿qué es una letra? - Una vaca que da leche.",
  "¿Qué hace un cocodrilo en el avión? Pues el piloto.",
  "Aro aro aro... ¿Qué le dijo un grano a otro? Nos vemos en el barro."
];

function mostrarChiste() {
  var c = CHISTES[Math.floor(Math.random() * CHISTES.length)];
  document.getElementById('chiste-box').textContent = "😂 " + c;
}

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// ---------- Reloj, Saludo y Fiesta ----------
function actualizarReloj() {
  var ahora = new Date();
  document.getElementById('clock').innerHTML = pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()) + '<span class="seconds">:' + pad(ahora.getSeconds()) + '</span>';
  document.getElementById('date').textContent = DIAS_SEMANA[ahora.getDay()] + ', ' + ahora.getDate() + ' de ' + MESES[ahora.getMonth()];

  var face = document.getElementById('face'), h = ahora.getHours();
  if (!document.body.classList.contains('cine-mode')) {
    face.classList.remove('manana', 'tarde', 'noche');
    if (h >= 6 && h < 12) face.classList.add('manana');
    else if (h >= 12 && h < 20) face.classList.add('tarde');
    else face.classList.add('noche');
  }
}

// ---------- Voz ----------
var vozDisponible = false, vozElegida = null;
if (window.speechSynthesis) {
  vozDisponible = true;
  var loadVoices = function() { var v = speechSynthesis.getVoices(); if(v.length) { for(var i=0; i<v.length; i++){ if(v[i].lang.indexOf('es')===0){ vozElegida = v[i]; return; } } vozElegida = v[0]; } };
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
}

function hablar(texto) {
  if (!vozDisponible) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; if (vozElegida) u.voice = vozElegida;
    u.onstart = function() { document.getElementById('face').classList.add('speaking'); };
    u.onend = function() { document.getElementById('face').classList.remove('speaking'); };
    u.onerror = function() { document.getElementById('face').classList.remove('speaking'); };
    speechSynthesis.speak(u);
  } catch(e) {}
}

function decirHola() {
  hablar('¡Hola familia! No os olvidéis de mirar la pizarra de notas y el calendario.');
}

// ---------- Modo Cine ----------
var timerInterval = null;
function toggleCine() {
  var body = document.body;
  body.classList.toggle('cine-mode');
  
  if (body.classList.contains('cine-mode')) {
    // Iniciar cuenta atrás de 2h
    var time = 2 * 60 * 60;
    document.getElementById('timer-display').textContent = "02:00:00";
    hablar('Modo cine activado. ¡A disfrutar de la película!');
    
    timerInterval = setInterval(function() {
      time--;
      var h = Math.floor(time / 3600);
      var m = Math.floor((time % 3600) / 60);
      var s = time % 60;
      document.getElementById('timer-display').textContent = pad(h)+':'+pad(m)+':'+pad(s);
      if (time <= 0) { clearInterval(timerInterval); toggleCine(); }
    }, 1000);
  } else {
    clearInterval(timerInterval);
    hablar('Saliendo del modo cine.');
  }
}

// ---------- Batería ----------
function actualizarBateria() {
  if (navigator.getBattery) {
    navigator.getBattery().then(function(battery) {
      function updateAll() {
        var level = Math.round(battery.level * 100);
        var bar = document.getElementById('battery-level'), text = document.getElementById('battery-text');
        bar.style.width = level + '%'; text.textContent = level + '%';
        if (level > 50) bar.style.background = '#4ade80';
        else if (level > 20) bar.style.background = '#fbbf24';
        else bar.style.background = '#ef4444';
      }
      updateAll(); battery.addEventListener('levelchange', updateAll);
    });
  } else { document.querySelector('.battery-block').style.display = 'none'; }
}

// ---------- Clima ----------
var WMO_CODES = {0: 'Despejado', 1: 'Mayormente despejado', 2: 'Parcialmente nublado', 3: 'Nublado', 45: 'Niebla', 48: 'Niebla helada', 51: 'Llovizna', 53: 'Llovizna', 55: 'Llovizna fuerte', 61: 'Lluvia ligera', 63: 'Lluvia', 65: 'Lluvia fuerte', 71: 'Nieve ligera', 73: 'Nieve', 75: 'Nieve fuerte', 80: 'Chubascos', 81: 'Chubascos', 82: 'Chubascos fuertes', 95: 'Tormenta', 96: 'Tormenta con granizo', 99: 'Tormenta fuerte'};
function actualizarClima() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current_weather=true&timezone=auto', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.current_weather) {
        document.getElementById('temp').textContent = Math.round(data.current_weather.temperature);
        document.getElementById('weather-desc').textContent = WMO_CODES[data.current_weather.weathercode] || 'Despejado';
        document.getElementById('city-name').textContent = CIUDAD;
      }
    }).catch(function() {});
}

// ---------- Calendario ----------
function parseICSDate(str) {
  if (!str) return null; str = str.trim();
  if (str.length === 8) return { date: new Date(parseInt(str.substr(0,4),10), parseInt(str.substr(4,2),10)-1, parseInt(str.substr(6,2),10)), allDay: true };
  if (str.length >= 15) {
    var y = parseInt(str.substr(0,4),10), m = parseInt(str.substr(4,2),10)-1, d = parseInt(str.substr(6,2),10), hh = parseInt(str.substr(9,2),10), mm = parseInt(str.substr(11,2),10);
    if (str.charAt(str.length - 1) === 'Z') return { date: new Date(Date.UTC(y, m, d, hh, mm)), allDay: false };
    return { date: new Date(y, m, d, hh, mm), allDay: false };
  }
  return null;
}
function parsearICS(texto) {
  var eventos = [], lines = texto.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n'), dentro = false, actual = {};
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l === 'BEGIN:VEVENT') { dentro = true; actual = {}; }
    else if (l === 'END:VEVENT') { if (actual.start && actual.summary) eventos.push(actual); dentro = false; }
    else if (dentro) {
      if (l.indexOf('STATUS:CANCELLED') === 0) actual.cancelado = true;
      if (l.indexOf('DTSTART') === 0) { var p = parseICSDate(l.split(':')[1]); if(p) { actual.start = p.date; actual.allDay = p.allDay; } }
      if (l.indexOf('SUMMARY:') === 0) actual.summary = l.substr(8).trim().replace(/\\,/g, ',');
    }
  }
  return eventos;
}
var eventosCache = [];
function cargarCalendario() {
  fetch(ICS_URL, { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(texto) {
    eventosCache = parsearICS(texto).filter(function(e) { return !e.cancelado; });
    eventosCache.sort(function(a, b) { return a.start - b.start; });
    renderizarEventos(); comprobarAvisos();
  }).catch(function() { document.getElementById('events-list').innerHTML = '<li class="empty">No se pudo cargar el calendario</li>'; });
}
function renderizarEventos() {
  var lista = document.getElementById('events-list'), ahora = new Date(), proximos = [];
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i], fin = new Date(ev.start.getTime());
    if (ev.allDay) fin.setHours(23, 59, 59); else fin.setHours(fin.getHours() + 1);
    if (fin >= ahora) { proximos.push(ev); if (proximos.length >= 5) break; }
  }
  if (proximos.length === 0) { lista.innerHTML = '<li class="empty">Sin eventos próximos</li>'; return; }
  var html = '';
  for (var j = 0; j < proximos.length; j++) {
    var e = proximos[j], d = e.start, h = pad(d.getHours()) + ':' + pad(d.getMinutes()), dia = DIAS_CORTOS[d.getDay()] + ' ' + d.getDate();
    if (e.allDay) h = 'Todo el día';
    else if (d.toDateString() === ahora.toDateString()) dia = 'Hoy';
    else { var m = new Date(ahora); m.setDate(m.getDate()+1); if(d.toDateString() === m.toDateString()) dia = 'Mañana'; }
    html += '<li class="event-item' + (e.allDay ? ' all-day' : '') + '"><div class="event-time"><span class="day">'+dia+'</span>'+h+'</div><div class="event-title">'+e.summary+'</div></li>';
