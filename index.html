<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel Familiar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f1419; color: #e8eef5;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s ease;
  }

  /* MODO DESCANSO */
  body.sleep-mode { background: #000000 !important; }
  body.sleep-mode .panel { opacity: 0; pointer-events: none; }
  body.sleep-mode .wake-overlay { display: block; }
  .wake-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; }

  .panel { display: grid; grid-template-rows: auto 1fr; height: 100vh; padding: 14px; gap: 12px; }

  /* PANEL SUPERIOR */
  .top-row {
    display: grid; grid-template-columns: auto 1fr auto auto; 
    align-items: center; gap: 20px;
    background: linear-gradient(135deg, #1a2332 0%, #141b26 100%);
    border-radius: 14px; padding: 14px 22px; border: 1px solid #253142;
  }

  /* CARITA (Ahora es redonda y simétrica) */
  .face-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face-container {
    width: 75px; height: 75px; background: #facc15; border-radius: 50%;
    position: relative; display: flex; justify-content: center; align-items: center;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1); transition: background 0.5s, transform 0.3s;
    cursor: pointer;
  }
  .face-container:active { transform: scale(0.95); }
  .face-container.manana { background: #fbbf24; } 
  .face-container.tarde { background: #facc15; } 
  .face-container.noche { background: #818cf8; }
  
  /* Animación de baile */
  .face-container.speaking { animation: dance 0.6s infinite alternate; }
  
  .eyes { display: flex; gap: 15px; position: absolute; top: 22px; }
  .eye { width: 9px; height: 14px; background: #1a2332; border-radius: 50%; animation: blink 4s infinite; transform-origin: center; }
  .mouth { width: 26px; height: 9px; background: #1a2332; border-radius: 0 0 30px 30px; position: absolute; bottom: 16px; transition: all 0.2s ease; }
  .face-container.speaking .mouth { height: 18px; width: 18px; border-radius: 50%; bottom: 12px; animation: talk 0.3s infinite alternate; }
  
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
  @keyframes talk { 0% { height: 12px; } 100% { height: 22px; } }
  @keyframes dance { 0% { transform: translateY(0) rotate(-10deg); } 100% { transform: translateY(-10px) rotate(10deg); } }

  .btn-hola { background: #3b82f6; color: white; border: none; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer; }
  .btn-hola:active { background: #2563eb; }

  /* RELOJ */
  .clock-block { text-align: center; }
  .clock-block .clock { font-size: 75px; font-weight: 300; letter-spacing: -2px; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums; }
  .clock-block .clock .seconds { font-size: 30px; color: #6b87a8; }
  .clock-block .date { font-size: 18px; color: #8aa2bd; margin-top: 4px; text-transform: capitalize; }

  /* CLIMA Y CONTADOR */
  .weather-block { text-align: right; min-width: 130px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .weather-info .temp { font-size: 45px; font-weight: 300; color: #ffffff; line-height: 1; }
  .weather-info .temp .unit { font-size: 22px; color: #8aa2bd; vertical-align: top; }
  .weather-info .desc { font-size: 14px; color: #8aa2bd; text-transform: capitalize; margin-top: 2px; }
  .weather-info .city { font-size: 11px; color: #55687d; }
  .weather-info .countdown { font-size: 12px; color: #fbbf24; margin-top: 4px; font-weight: bold; }
  .btn-sleep { font-size: 24px; background: none; border: none; cursor: pointer; opacity: 0.6; }

  /* BATERÍA */
  .battery-block { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 40px; }
  .battery-icon { width: 30px; height: 14px; border: 2px solid #8aa2bd; border-radius: 3px; position: relative; padding: 2px; }
  .battery-icon::after { content: ''; position: absolute; right: -5px; top: 3px; width: 3px; height: 6px; background: #8aa2bd; border-radius: 0 2px 2px 0; }
  .battery-level { height: 100%; background: #4ade80; border-radius: 1px; transition: width 0.5s, background 0.5s; }
  .battery-text { font-size: 11px; color: #8aa2bd; font-weight: bold; }

  /* DISEÑO INFERIOR EN 2 COLUMNAS (Armonioso) */
  .bottom-row { 
    display: grid; 
    grid-template-columns: 1fr 1fr; /* Dos columnas iguales */
    gap: 12px; 
    min-height: 0; 
  }
  
  .card { background: linear-gradient(135deg, #1a2332 0%, #141b26 100%); border-radius: 14px; padding: 12px 16px; border: 1px solid #253142; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .card-title { font-size: 14px; font-weight: 600; color: #6b87a8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid #253142; flex-shrink: 0; }

  /* Columna Izquierda: Eventos (Mitad superior) + Chistes (Mitad inferior) */
  .left-column { display: grid; grid-template-rows: 1fr 1fr; gap: 12px; min-height: 0; }
  
  .events-list { list-style: none; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .event-item { display: grid; grid-template-columns: 60px 1fr; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px dashed #1f2a3a; }
  .event-time { font-size: 12px; color: #6b87a8; }
  .event-time .day { display: block; font-size: 10px; color: #4a6079; }
  .event-title { font-size: 15px; color: #e8eef5; }
  .empty { color: #55687d; font-size: 14px; padding: 10px 0; font-style: italic; }

  .fun-card { justify-content: center; text-align: center; }
  .chiste-text { font-size: 18px; color: #fbbf24; font-weight: 500; line-height: 1.3; margin-bottom: 10px; }
  .dato-text { font-size: 15px; color: #a78bfa; font-style: italic; line-height: 1.3; }

  /* Columna Derecha: Notas familiares (Ocupa toda la altura) */
  .notes-area { flex: 1; width: 100%; background: #0b1016; color: #e8eef5; border: 1px solid #253142; border-radius: 8px; padding: 10px; font-size: 16px; line-height: 1.4; font-family: inherit; resize: none; outline: none; min-height: 0; }
  .notes-hint { font-size: 11px; color: #4a6079; margin-top: 4px; text-align: right; flex-shrink: 0; transition: color 0.3s; }
  .notes-hint.saved { color: #4ade80; }

  @media (max-width: 800px) {
    .top-row { grid-template-columns: auto 1fr auto; padding: 10px; gap: 10px; }
    .battery-block { display: none; }
    .clock-block .clock { font-size: 50px; }
    .clock-block .clock .seconds { font-size: 22px; }
    .weather-info .temp { font-size: 35px; }
    .face-container { width: 60px; height: 60px; }
    .eyes { top: 18px; gap: 12px; }
    .eye { width: 8px; height: 12px; }
    .mouth { bottom: 12px; width: 20px; height: 8px; }
    
    .bottom-row { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .left-column { grid-template-rows: 1fr; }
    .events-list { display: flex; flex-direction: row; overflow-x: auto; gap: 10px; }
    .event-item { border-bottom: none; border-right: 1px dashed #1f2a3a; padding: 0 10px; min-width: 120px; }
    .chiste-text { font-size: 16px; }
    .dato-text { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="wake-overlay" onclick="toggleSleep()"></div>

<div class="panel">
  <!-- PANEL SUPERIOR -->
  <div class="top-row">
    <div class="face-wrapper">
      <div class="face-container" id="face" onclick="decirHola()">
        <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
        <div class="mouth"></div>
      </div>
      <button class="btn-hola" onclick="decirHola()">Hola Arwen</button>
    </div>

    <div class="clock-block">
      <div class="clock" id="clock">--:--<span class="seconds">:--</span></div>
      <div class="date" id="date">Cargando...</div>
    </div>

    <div class="weather-block">
      <div class="weather-info">
        <div class="temp"><span id="temp">--</span><span class="unit">°C</span></div>
        <div class="desc" id="weather-desc">Cargando...</div>
        <div class="city" id="city-name"></div>
        <div class="countdown" id="countdown"></div>
      </div>
      <button class="btn-sleep" onclick="toggleSleep()" title="Apagar pantalla">🌙</button>
    </div>

    <div class="battery-block">
      <div class="battery-icon"><div class="battery-level" id="battery-level" style="width: 100%;"></div></div>
      <div class="battery-text" id="battery-text">--%</div>
    </div>
  </div>

  <!-- DISEÑO INFERIOR EN 2 COLUMNAS -->
  <div class="bottom-row">
    
    <!-- Columna Izquierda: Eventos (arriba) y Chistes (abajo) -->
    <div class="left-column">
      <div class="card">
        <div class="card-title">Próximos eventos</div>
        <ul class="events-list" id="events-list"><li class="empty">Cargando...</li></ul>
      </div>
      <div class="card fun-card">
        <div class="chiste-text" id="chiste-box"></div>
        <div class="dato-text" id="dato-box"></div>
      </div>
    </div>

    <!-- Columna Derecha: Notas -->
    <div class="card">
      <div class="card-title">Notas familiares</div>
      <textarea class="notes-area" id="notes" placeholder="Escribe aquí..."></textarea>
      <div class="notes-hint" id="notes-hint">Se guardan automáticamente</div>
    </div>

  </div>
</div>

function pad(n) { return n < 10 ? '0' + n : '' + n; }

// ---------- RELOJ Y COLOR CARITA ----------
function actualizarReloj() {
  var ahora = new Date();
  document.getElementById('clock').innerHTML = pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()) + '<span class="seconds">:' + pad(ahora.getSeconds()) + '</span>';
  document.getElementById('date').textContent = DIAS_SEMANA[ahora.getDay()] + ', ' + ahora.getDate() + ' de ' + MESES[ahora.getMonth()];

  var face = document.getElementById('face'), h = ahora.getHours();
  face.classList.remove('manana', 'tarde', 'noche');
  if (h >= 6 && h < 12) face.classList.add('manana');
  else if (h >= 12 && h < 20) face.classList.add('tarde');
  else face.classList.add('noche');

  var hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  var meta = new Date(EVENTO_FUTURO.anio, EVENTO_FUTURO.mes, EVENTO_FUTURO.dia);
  var diffDias = Math.ceil((meta - hoy) / (1000 * 60 * 60 * 24));
  if (diffDias > 0) document.getElementById('countdown').textContent = 'Faltan ' + diffDias + ' días para ' + EVENTO_FUTURO.texto;
}

// ---------- VOZ (CON RESPALDO PARA FIRE OS) ----------
var vozDisponible = false, vozElegida = null;
if (window.speechSynthesis) {
  vozDisponible = true;
  var loadVoices = function() { var v = speechSynthesis.getVoices(); if(v.length) { for(var i=0; i<v.length; i++){ if(v[i].lang.indexOf('es')===0){ vozElegida = v[i]; return; } } vozElegida = v[0]; } };
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
}
function hablar(texto) {
  if (!vozDisponible) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; if (vozElegida) u.voice = vozElegida;
    u.onstart = function() { document.getElementById('face').classList.add('speaking'); };
    u.onend = function() { document.getElementById('face').classList.remove('speaking'); };
    u.onerror = function() { document.getElementById('face').classList.remove('speaking'); };
    speechSynthesis.speak(u);
    setTimeout(function(){ speechSynthesis.resume(); }, 500);
  } catch(e) {}
}

function decirHola() {
  var h = new Date().getHours();
  var saludo = "¡Hola Arwen! ";
  if (h < 12) saludo += "¡Buenos días! ¿Cómo estás?";
  else if (h < 20) saludo += "¡Buenas tardes! ¿Cómo estás?";
  else saludo += "¡Buenas noches! ¿Cómo estás?";
  hablar(saludo);
}

// ---------- MODO DESCANSO ----------
function toggleSleep() {
  document.body.classList.toggle('sleep-mode');
  if (!document.body.classList.contains('sleep-mode')) decirHola();
}

// ---------- BATERÍA ----------
function actualizarBateria() {
  if (navigator.getBattery) {
    navigator.getBattery().then(function(battery) {
      function updateAll() {
        var level = Math.round(battery.level * 100);
        var bar = document.getElementById('battery-level'), text = document.getElementById('battery-text');
        if(bar && text) {
          bar.style.width = level + '%'; text.textContent = level + '%';
          if (level > 50) bar.style.background = '#4ade80'; else if (level > 20) bar.style.background = '#fbbf24'; else bar.style.background = '#ef4444';
        }
      }
      updateAll(); battery.addEventListener('levelchange', updateAll);
    });
  }
}

// ---------- CALENDARIO ----------
function parseICSDate(str) {
  if (!str) return null; str = str.trim();
  if (str.length === 8) return { date: new Date(parseInt(str.substr(0,4),10), parseInt(str.substr(4,2),10)-1, parseInt(str.substr(6,2),10)), allDay: true };
  if (str.length >= 15) {
    var y = parseInt(str.substr(0,4),10), m = parseInt(str.substr(4,2),10)-1, d = parseInt(str.substr(6,2),10), hh = parseInt(str.substr(9,2),10), mm = parseInt(str.substr(11,2),10);
    if (str.charAt(str.length - 1) === 'Z') return { date: new Date(Date.UTC(y, m, d, hh, mm)), allDay: false };
    return { date: new Date(y, m, d, hh, mm), allDay: false };
  }
  return null;
}
function parsearICS(texto) {
  var eventos = [], lines = texto.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n'), dentro = false, actual = {};
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l === 'BEGIN:VEVENT') { dentro = true; actual = {}; }
    else if (l === 'END:VEVENT') { if (actual.start && actual.summary) eventos.push(actual); dentro = false; }
    else if (dentro) {
      if (l.indexOf('STATUS:CANCELLED') === 0) actual.cancelado = true;
      if (l.indexOf('DTSTART') === 0) { var p = parseICSDate(l.split(':')[1]); if(p) { actual.start = p.date; actual.allDay = p.allDay; } }
      if (l.indexOf('SUMMARY:')
