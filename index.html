<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Panel Familiar</title>
<style>
  /* ============ RESET Y BASE ============ */
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0f1419;
    color: #e8eef5;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ LAYOUT PRINCIPAL ============ */
  .panel {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
    padding: 14px;
    gap: 12px;
  }

  /* Fila superior: reloj + clima + carita */
  .top-row {
    display: grid;
    grid-template-columns: auto 1fr auto; /* Carita, Reloj, Clima */
    align-items: center;
    gap: 20px;
    background: linear-gradient(135deg, #1a2332 0%, #141b26 100%);
    border-radius: 14px;
    padding: 14px 22px;
    border: 1px solid #253142;
  }

  /* --- LA CARITA CSS --- */
  .face-container {
    width: 90px;
    height: 90px;
    background: #facc15; /* Amarillo */
    border-radius: 50%;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.1);
  }
  .eyes {
    display: flex;
    gap: 18px;
    position: absolute;
    top: 28px;
  }
  .eye {
    width: 10px;
    height: 16px;
    background: #1a2332;
    border-radius: 50%;
    /* Animación de pestañeo */
    animation: blink 4s infinite; 
    transform-origin: center;
  }
  .mouth {
    width: 30px;
    height: 10px;
    background: #1a2332;
    border-radius: 0 0 30px 30px;
    position: absolute;
    bottom: 22px;
    transition: all 0.2s ease;
  }
  /* Cuando habla, la boca se hace un círculo */
  .face-container.speaking .mouth {
    height: 20px;
    width: 20px;
    border-radius: 50%;
    bottom: 18px;
    animation: talk 0.3s infinite alternate;
  }

  @keyframes blink {
    0%, 96%, 100% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
  }
  @keyframes talk {
    0% { height: 15px; }
    100% { height: 25px; }
  }

  /* --- RELOJ --- */
  .clock-block { text-align: center; }
  .clock-block .clock {
    font-size: 85px;
    font-weight: 300;
    letter-spacing: -2px;
    line-height: 1;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }
  .clock-block .clock .seconds {
    font-size: 40px;
    color: #6b87a8;
  }
  .clock-block .date {
    font-size: 20px;
    color: #8aa2bd;
    margin-top: 6px;
    text-transform: capitalize;
  }

  /* --- CLIMA --- */
  .weather-block {
    text-align: right;
    min-width: 160px;
  }
  .weather-block .temp {
    font-size: 58px;
    font-weight: 300;
    color: #ffffff;
    line-height: 1;
  }
  .weather-block .temp .unit { font-size: 28px; color: #8aa2bd; vertical-align: top; margin-left: 2px; }
  .weather-block .desc {
    font-size: 18px;
    color: #8aa2bd;
    text-transform: capitalize;
    margin-top: 4px;
  }
  .weather-block .city {
    font-size: 14px;
    color: #55687d;
    margin-top: 2px;
  }

  /* Fila inferior: eventos + notas */
  .bottom-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    min-height: 0;
  }

  .card {
    background: linear-gradient(135deg, #1a2332 0%, #141b26 100%);
    border-radius: 14px;
    padding: 14px 18px;
    border: 1px solid #253142;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .card-title {
    font-size: 16px;
    font-weight: 600;
    color: #6b87a8;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid #253142;
    flex-shrink: 0;
  }

  /* Eventos */
  .events-list {
    list-style: none;
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
  }
  .events-list::-webkit-scrollbar { width: 4px; }
  .events-list::-webkit-scrollbar-thumb { background: #253142; border-radius: 2px; }

  .event-item {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 12px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px dashed #1f2a3a;
  }
  .event-item:last-child { border-bottom: none; }
  .event-time {
    font-size: 14px;
    color: #6b87a8;
    font-variant-numeric: tabular-nums;
  }
  .event-time .day {
    display: block;
    font-size: 12px;
    color: #4a6079;
    text-transform: capitalize;
  }
  .event-title {
    font-size: 18px;
    color: #e8eef5;
    line-height: 1.25;
    word-break: break-word;
  }
  .event-item.all-day .event-time { color: #e0a94a; }
  .empty { color: #55687d; font-size: 16px; padding: 12px 0; font-style: italic; }

  /* Notas */
  .notes-area {
    flex: 1;
    width: 100%;
    background: #0b1016;
    color: #e8eef5;
    border: 1px solid #253142;
    border-radius: 8px;
    padding: 12px;
    font-size: 17px;
    line-height: 1.5;
    font-family: inherit;
    resize: none;
    outline: none;
    min-height: 0;
  }
  .notes-area:focus { border-color: #3b82f6; }
  .notes-hint {
    font-size: 12px;
    color: #4a6079;
    margin-top: 6px;
    text-align: right;
    flex-shrink: 0;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 800px) {
    .clock-block .clock { font-size: 60px; }
    .clock-block .clock .seconds { font-size: 30px; }
    .clock-block .date { font-size: 16px; }
    .weather-block .temp { font-size: 42px; }
    .weather-block { min-width: 130px; }
    .event-title { font-size: 15px; }
    .notes-area { font-size: 15px; }
    .face-container { width: 70px; height: 70px; }
    .eyes { top: 20px; gap: 14px; }
    .eye { width: 8px; height: 12px; }
    .mouth { bottom: 16px; width: 24px; height: 8px; }
  }
</style>
</head>
<body>

<div class="panel">

  <!-- Fila superior: carita + reloj + clima -->
  <div class="top-row">
    
    <!-- Carita Animada -->
    <div class="face-container" id="face">
      <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="clock-block">
      <div class="clock" id="clock">--:--<span class="seconds">:--</span></div>
      <div class="date" id="date">cargando...</div>
    </div>

    <div class="weather-block">
      <div class="temp"><span id="temp">--</span><span class="unit">°C</span></div>
      <div class="desc" id="weather-desc">Cargando clima...</div>
      <div class="city" id="city-name"></div>
    </div>
  </div>

  <!-- Fila inferior: eventos y notas -->
  <div class="bottom-row">

    <div class="card">
      <div class="card-title">Próximos eventos</div>
      <ul class="events-list" id="events-list">
        <li class="empty">Cargando calendario...</li>
      </ul>
    </div>

    <div class="card">
      <div class="card-title">Notas familiares</div>
      <textarea
        class="notes-area"
        id="notes"
        placeholder="Escribe aquí recados para la familia..."
        spellcheck="false"></textarea>
      <div class="notes-hint" id="notes-hint">Se guardan automáticamente</div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN — Edita estos valores con tus datos
   ============================================================ */

// URL pública ICS de Zoho, pasada por un proxy (Codetabs)
var ICS_URL = 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent('https://calendar.zoho.eu/ical/0801124aaacfb956572a96ba7aff45bc0000299d45a5771512967b2d8f19afec8253e8336b5ce1ce89cf81f6dc8b643ac7f8e1cf49b45c1ca4245a0ef6cd28a117efee958e7a652117409e68ad41');

// Coordenadas exactas de Luserna San Giovanni
var LAT = 44.8150;
var LON = 7.2450;
var CIUDAD = 'Luserna San Giovanni';

// Minutos antes del evento para avisar por voz
var AVISO_MIN = 15;

/* ============================================================
   FIN DE CONFIGURACIÓN
   ============================================================ */

// ---------- Utilidades de fecha en español ----------
var DIAS_SEMANA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio',
             'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var DIAS_CORTOS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function fechaLarga(d) {
  return DIAS_SEMANA[d.getDay()] + ', ' + d.getDate() + ' de ' + MESES[d.getMonth()];
}

// ---------- Reloj y fecha ----------
function actualizarReloj() {
  var ahora = new Date();
  var h = pad(ahora.getHours());
  var m = pad(ahora.getMinutes());
  var s = pad(ahora.getSeconds());
  document.getElementById('clock').innerHTML = h + ':' + m + '<span class="seconds">:' + s + '</span>';
  document.getElementById('date').textContent = fechaLarga(ahora);
}

// ---------- Clima (Open-Meteo) ----------
var WMO_CODES = {
  0: 'Cielo despejado', 1: 'Mayormente despejado', 2: 'Parcialmente nublado', 3: 'Nublado',
  45: 'Niebla', 48: 'Niebla con escarcha',
  51: 'Llovizna ligera', 53: 'Llovizna', 55: 'Llovizna intensa',
  56: 'Llovizna helada', 57: 'Llovizna helada intensa',
  61: 'Lluvia ligera', 63: 'Lluvia', 65: 'Lluvia intensa',
  66: 'Lluvia helada', 67: 'Lluvia helada intensa',
  71: 'Nieve ligera', 73: 'Nieve', 75: 'Nieve intensa', 77: 'Granizo',
  80: 'Chubascos ligeros', 81: 'Chubascos', 82: 'Chubascos fuertes',
  85: 'Chubascos de nieve', 86: 'Chubascos de nieve intensos',
  95: 'Tormenta', 96: 'Tormenta con granizo', 99: 'Tormenta fuerte con granizo'
};

function actualizarClima() {
  var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + LAT +
            '&longitude=' + LON + '&current_weather=true&timezone=auto';
  fetch(url, { cache: 'no-store' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      if (!data || !data.current_weather) throw new Error('Datos inválidos');
      var w = data.current_weather;
      document.getElementById('temp').textContent = Math.round(w.temperature);
      document.getElementById('weather-desc').textContent = WMO_CODES[w.weathercode] || 'Sin datos';
      document.getElementById('city-name').textContent = CIUDAD;
    })
    .catch(function(err) {
      document.getElementById('temp').textContent = '--';
      document.getElementById('weather-desc').textContent = 'Sin datos';
    });
}

// ---------- Parseo de ICS ----------
function parseICSDate(str, params) {
  if (!str) return null;
  str = str.trim();
  if (str.length === 8 && str.indexOf('T') === -1) {
    return { date: new Date(parseInt(str.substr(0,4),10), parseInt(str.substr(4,2),10)-1, parseInt(str.substr(6,2),10)), allDay: true };
  }
  if (str.length >= 15 && str.charAt(8) === 'T') {
    var y = parseInt(str.substr(0,4),10), m = parseInt(str.substr(4,2),10)-1, d = parseInt(str.substr(6,2),10);
    var hh = parseInt(str.substr(9,2),10), mm = parseInt(str.substr(11,2),10), ss = parseInt(str.substr(13,2),10);
    if (str.charAt(str.length - 1) === 'Z') return { date: new Date(Date.UTC(y, m, d, hh, mm, ss)), allDay: false };
    return { date: new Date(y, m, d, hh, mm, ss), allDay: false };
  }
  return null;
}

function unfoldICS(text) {
  return text.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '');
}

function parsearICS(texto) {
  var eventos = [];
  var lines = unfoldICS(texto).split('\n');
  var dentro = false;
  var actual = {};
  for (var i = 0; i < lines.length; i++) {
    var linea = lines[i];
    if (linea === 'BEGIN:VEVENT') { dentro = true; actual = {}; continue; }
    if (linea === 'END:VEVENT') {
      if (actual.start && actual.summary) eventos.push(actual);
      dentro = false; continue;
    }
    if (!dentro) continue;
    if (linea.indexOf('STATUS:CANCELLED') === 0) { actual.cancelado = true; continue; }
    if (linea.indexOf('DTSTART') === 0) {
      var partes = linea.split(':');
      var parsed = parseICSDate(partes.slice(1).join(':'));
      if (parsed) { actual.start = parsed.date; actual.allDay = parsed.allDay; }
      continue;
    }
    if (linea.indexOf('SUMMARY:') === 0) {
      actual.summary = linea.substr(8).trim().replace(/\\,/g, ',').replace(/\\;/g, ';').replace(/\\n/gi, ' ');
      continue;
    }
  }
  return eventos;
}

var eventosCache = [];

function cargarCalendario() {
  if (!ICS_URL || ICS_URL.indexOf('XXXX') === 0) return;
  fetch(ICS_URL, { cache: 'no-store' })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function(texto) {
      eventosCache = parsearICS(texto).filter(function(e) { return !e.cancelado; });
      eventosCache.sort(function(a, b) { return a.start - b.start; });
      renderizarEventos();
      comprobarAvisos();
    })
    .catch(function(err) {
      document.getElementById('events-list').innerHTML = '<li class="empty">No se pudo cargar el calendario</li>';
    });
}

function renderizarEventos() {
  var lista = document.getElementById('events-list');
  var ahora = new Date();
  var proximos = [];
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i];
    var fin = new Date(ev.start.getTime());
    if (ev.allDay) fin.setHours(23, 59, 59, 999);
    else fin = new Date(ev.start.getTime() + 60 * 60 * 1000);
    if (fin >= ahora) {
      proximos.push(ev);
      if (proximos.length >= 6) break;
    }
  }
  if (proximos.length === 0) { lista.innerHTML = '<li class="empty">Sin eventos próximos</li>'; return; }
  
  var html = '';
  for (var j = 0; j < proximos.length; j++) {
    var e = proximos[j];
    var fechaEv = e.start;
    var horaStr, diaStr;
    if (e.allDay) {
      horaStr = 'Todo el día';
      diaStr = DIAS_CORTOS[fechaEv.getDay()] + ' ' + fechaEv.getDate() + '/' + (fechaEv.getMonth() + 1);
    } else {
      horaStr = pad(fechaEv.getHours()) + ':' + pad(fechaEv.getMinutes());
      var hoy = new Date();
      var esHoy = fechaEv.toDateString() === hoy.toDateString();
      var manana = new Date(hoy); manana.setDate(hoy.getDate() + 1);
      var esManana = fechaEv.toDateString() === manana.toDateString();
      if (esHoy) diaStr = 'Hoy'; else if (esManana) diaStr = 'Mañana';
      else diaStr = DIAS_CORTOS[fechaEv.getDay()] + ' ' + fechaEv.getDate() + '/' + (fechaEv.getMonth() + 1);
    }
    html += '<li class="event-item' + (e.allDay ? ' all-day' : '') + '">' +
              '<div class="event-time"><span class="day">' + diaStr + '</span>' + horaStr + '</div>' +
              '<div class="event-title">' + escaparHTML(e.summary) + '</div>' +
            '</li>';
  }
  lista.innerHTML = html;
}

function escaparHTML(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ---------- Avisos por voz (TTS) ----------
var avisosHechos = {};
var vozDisponible = false;
var vozElegida = null;

function inicializarVoz() {
  if (!window.speechSynthesis) return;
  vozDisponible = true;
  function elegirVoz() {
    var voces = speechSynthesis.getVoices();
    if (!voces || voces.length === 0) return;
    for (var i = 0; i < voces.length; i++) {
      if (voces[i].lang && voces[i].lang.toLowerCase().indexOf('es') === 0) { vozElegida = voces[i]; return; }
    }
    vozElegida = voces[0];
  }
  elegirVoz();
  if (typeof speechSynthesis.onvoiceschanged !== 'undefined') speechSynthesis.onvoiceschanged = elegirVoz;
}

function hablar(texto) {
  if (!vozDisponible) return;
  try {
    speechSynthesis.cancel();
    var utter = new SpeechSynthesisUtterance(texto);
    utter.lang = 'es-ES'; utter.rate = 0.95; utter.pitch = 1; utter.volume = 1;
    if (vozElegida) utter.voice = vozElegida;
    
    // Animación de la boca al hablar
    var face = document.getElementById('face');
    utter.onstart = function() { face.classList.add('speaking'); };
    utter.onend = function() { face.classList.remove('speaking'); };
    utter.onerror = function() { face.classList.remove('speaking'); };
    
    speechSynthesis.speak(utter);
  } catch (err) {}
}

function comprobarAvisos() {
  if (!vozDisponible) return;
  var ahora = new Date();
  var umbralMs = AVISO_MIN * 60 * 1000;

  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i];
    var inicio = ev.start.getTime();
    var diff = inicio - ahora.getTime();

    // 1. Eventos normales (Aviso 15 mins antes)
    if (!ev.allDay && diff > 0 && diff <= umbralMs) {
      var minutos = Math.max(1, Math.round(diff / 60000));
      var clave = inicio + '|' + ev.summary + '_pre';
      if (!avisosHechos[clave]) {
        avisosHechos[clave] = true;
        hablar('En ' + minutos + ' minutos: ' + ev.summary);
      }
    }

    // 2. Eventos normales (Aviso 0 mins - Es la hora)
    if (!ev.allDay && diff <= 0 && diff > -60000) { // Si empezó hace menos de 1 min
      var claveCero = inicio + '|' + ev.summary + '_cero';
      if (!avisosHechos[claveCero]) {
        avisosHechos[claveCero] = true;
        hablar('Atención, es la hora de: ' + ev.summary);
      }
    }

    // 3. Eventos de Todo el Día (Aviso el día anterior a las 20:00)
    if (ev.allDay) {
      var manana = new Date(ahora); manana.setDate(ahora.getDate() + 1);
      if (ahora.getHours() === 20 && ahora.getMinutes() === 0 && ev.start.toDateString() === manana.toDateString()) {
        var claveDia = inicio + '|' + ev.summary + '_dia';
        if (!avisosHechos[claveDia]) {
          avisosHechos[claveDia] = true;
          hablar('Recordatorio para mañana: ' + ev.summary);
        }
      }
    }
  }
}

// ---------- Notas familiares ----------
var STORAGE_KEY = 'panel_familiar_notas';
function cargarNotas() {
  try {
    var guardado = localStorage.getItem(STORAGE_KEY);
    if (guardado !== null) document.getElementById('notes').value = guardado;
  } catch (e) {}
}
function guardarNotas() {
  try {
    localStorage.setItem(STORAGE_KEY, document.getElementById('notes').value);
    var hint = document.getElementById('notes-hint');
    hint.textContent = 'Guardado ✓';
    setTimeout(function() { hint.textContent = 'Se guardan automáticamente'; }, 1500);
  } catch (e) {}
}

// ---------- Inicialización ----------
function iniciar() {
  actualizarReloj();
  setInterval(actualizarReloj, 1000);

  actualizarClima();
  setInterval(actualizarClima, 10 * 60 * 1000);

  cargarCalendario();
  setInterval(cargarCalendario, 5 * 60 * 1000);

  inicializarVoz();
  setInterval(comprobarAvisos, 30 * 1000);

  cargarNotas();
  document.getElementById('notes').addEventListener('input', guardarNotas);

  document.addEventListener('touchstart', function primerToque() {
    if (vozDisponible) {
      try { var u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
    }
    document.removeEventListener('touchstart', primerToque);
  }, { once: true, passive: true });

  document.addEventListener('visibilitychange', function() {
    if (!document.hidden && vozDisponible) {
      try { speechSynthesis.resume(); } catch (e) {}
      comprobarAvisos();
    }
  });
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else iniciar();
</script>
</body>
</html>
