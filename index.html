<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>Panel Familiar</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: linear-gradient(135deg, #101b2b 0%, #1e1b3a 100%);
    color: #e8eef5;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background 0.5s ease;
  }

  /* MODO DESCANSO (Luna) */
  body.sleep-mode { background: #000000 !important; }
  body.sleep-mode .panel { opacity: 0; pointer-events: none; }
  body.sleep-mode .wake-overlay { display: block; }
  .wake-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; cursor: pointer; }

  /* MODO PORTARRETRATOS (Protector de pantalla) */
  .screensaver {
    display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 1000; cursor: pointer; overflow: hidden;
  }
  .screensaver.active { display: block; }
  .screensaver img {
    width: 100%; height: 100%; object-fit: contain; /* Mantiene la calidad y proporción */
    position: absolute; top: 0; left: 0; opacity: 0;
    transition: opacity 1.5s ease-in-out;
  }
  .screensaver img.active { opacity: 1; }

  .panel { display: flex; flex-direction: column; height: 100vh; padding: 12px; gap: 12px; overflow-y: auto; }

  /* PANEL SUPERIOR */
  .top-row {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: 15px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    border-radius: 16px; padding: 15px 20px; border: 1px solid rgba(255,255,255,0.1);
  }

  /* CARITA ANIMADA */
  .face-wrapper { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .face-container {
    width: 75px; height: 75px; background: #facc15; border-radius: 50%;
    position: relative; display: flex; justify-content: center; align-items: center;
    box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 0 0 20px rgba(250, 204, 21, 0.3);
    cursor: pointer;
    animation: breathe 3s infinite ease-in-out;
  }
  .face-container:active { transform: scale(0.95); }
  .face-container.manana { background: #fbbf24; } 
  .face-container.tarde { background: #facc15; } 
  .face-container.noche { background: #818cf8; box-shadow: 0 0 20px rgba(129, 140, 248, 0.4); }
  .face-container.speaking { animation: dance 0.4s infinite alternate; }
  
  .eyes { display: flex; gap: 15px; position: absolute; top: 22px; }
  .eye { width: 9px; height: 14px; background: #1a2332; border-radius: 50%; animation: blink 4s infinite; transform-origin: center; }
  .mouth { width: 26px; height: 9px; background: #1a2332; border-radius: 0 0 30px 30px; position: absolute; bottom: 16px; transition: all 0.2s ease; }
  .face-container.speaking .mouth { height: 18px; width: 18px; border-radius: 50%; bottom: 12px; animation: talk 0.3s infinite alternate; }
  
  @keyframes blink { 0%, 96%, 100% { transform: scaleY(1); } 98% { transform: scaleY(0.1); } }
  @keyframes talk { 0% { height: 12px; } 100% { height: 22px; } }
  @keyframes dance { 0% { transform: translateY(0) rotate(-10deg); } 100% { transform: translateY(-10px) rotate(10deg); } }
  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

  .btn-hola { background: #3b82f6; color: white; border: none; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }
  .btn-hola:active { background: #2563eb; transform: translateY(2px); }

  /* RELOJ */
  .clock-block { text-align: center; flex: 1; }
  .clock-block .clock { font-size: 65px; font-weight: 300; letter-spacing: -2px; line-height: 1; color: #ffffff; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  .clock-block .clock .seconds { font-size: 25px; color: #a78bfa; }
  .clock-block .date { font-size: 16px; color: #9ca3af; margin-top: 4px; text-transform: capitalize; font-weight: 500; }

  /* CLIMA Y ALERTAS */
  .weather-block { text-align: right; min-width: 140px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .weather-info .temp { font-size: 40px; font-weight: 300; color: #ffffff; line-height: 1; }
  .weather-info .temp .unit { font-size: 20px; color: #a78bfa; vertical-align: top; }
  .weather-info .desc { font-size: 13px; color: #9ca3af; text-transform: capitalize; margin-top: 2px; }
  .weather-info .city { font-size: 11px; color: #6b7280; }
  .weather-info .alert { font-size: 11px; color: #38bdf8; margin-top: 4px; font-weight: bold; display: none; }
  .weather-info .countdown { font-size: 12px; color: #fbbf24; margin-top: 2px; font-weight: bold; }
  .btn-sleep { font-size: 22px; background: none; border: none; cursor: pointer; opacity: 0.6; }
 /* BATERÍA */
  .battery-block { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .battery-icon { width: 28px; height: 12px; border: 2px solid #6b7280; border-radius: 3px; position: relative; padding: 2px; }
  .battery-icon::after { content: ''; position: absolute; right: -5px; top: 2px; width: 3px; height: 4px; background: #6b7280; border-radius: 0 2px 2px 0; }
  .battery-level { height: 100%; background: #4ade80; border-radius: 1px; transition: width 0.5s, background 0.5s; }
  .battery-text { font-size: 10px; color: #9ca3af; font-weight: bold; }

  /* DISEÑO INFERIOR */
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1; min-height: 0; }
  
  .card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border-radius: 16px; padding: 15px; border: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; min-height: 0; overflow: hidden; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); }
  .card-title { font-size: 13px; font-weight: 600; color: #a78bfa; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid rgba(167, 139, 250, 0.2); flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }

  .left-column { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  
  .events-card { flex: 1; }
  .events-list { list-style: none; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .events-list::-webkit-scrollbar { width: 4px; }
  .events-list::-webkit-scrollbar-thumb { background: #a78bfa; border-radius: 2px; }
  .event-item { display: grid; grid-template-columns: 55px 1fr; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); }
  .event-time { font-size: 12px; color: #a78bfa; font-weight: 600; }
  .event-time .day { display: block; font-size: 10px; color: #9ca3af; }
  .event-title { font-size: 15px; color: #f3f4f6; }
  .empty { color: #6b7280; font-size: 14px; padding: 10px 0; font-style: italic; }

  /* Tarjeta de Chistes y Datos */
  .fun-card { flex: 1; justify-content: center; text-align: center; background: linear-gradient(135deg, rgba(251, 191, 36, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%); border: 1px solid rgba(251, 191, 36, 0.3); position: relative; }
  .chiste-text { font-size: 18px; color: #fbbf24; font-weight: 500; line-height: 1.3; margin-bottom: 12px; }
  .dato-text { font-size: 15px; color: #c4b5fd; font-style: italic; line-height: 1.3; }
  
  /* Botón para contar el chiste */
  .btn-play-chiste { 
    position: absolute; top: 10px; right: 10px; 
    background: #fbbf24; color: #1a2332; border: none; border-radius: 50%; 
    width: 30px; height: 30px; font-size: 14px; font-weight: bold; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: transform 0.2s;
  }
  .btn-play-chiste:active { transform: scale(0.9); }

  /* Columna Derecha: Notas */
  .notes-area { flex: 1; width: 100%; background: rgba(0,0,0,0.2); color: #f3f4f6; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 12px; font-size: 16px; line-height: 1.5; font-family: inherit; resize: none; outline: none; min-height: 0; transition: border-color 0.3s; }
  .notes-area:focus { border-color: #a78bfa; }
  .notes-hint { font-size: 11px; color: #6b7280; margin-top: 6px; text-align: right; flex-shrink: 0; transition: color 0.3s; }
  .notes-hint.saved { color: #4ade80; }

  /* RESPONSIVE */
  @media (max-width: 800px), (orientation: portrait) {
    .bottom-row { grid-template-columns: 1fr; }
    .left-column { flex-direction: row; flex-wrap: wrap; }
    .events-card { flex: 1 1 100%; }
    .fun-card { flex: 1 1 100%; }
    .clock-block .clock { font-size: 50px; }
    .top-row { justify-content: center; }
  }
</style>
</head>

var chisteActual = "";

function pad(n) { return n < 10 ? '0' + n : '' + n; }

function actualizarReloj() {
  var ahora = new Date();
  document.getElementById('clock').innerHTML = pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()) + '<span class="seconds">:' + pad(ahora.getSeconds()) + '</span>';
  document.getElementById('date').textContent = DIAS_SEMANA[ahora.getDay()] + ', ' + ahora.getDate() + ' de ' + MESES[ahora.getMonth()];

 // ---------- VOZ ----------
var vozDisponible = false, vozElegida = null;
if (window.speechSynthesis) {
  vozDisponible = true;
  var loadVoices = function() { var v = speechSynthesis.getVoices(); if(v.length) { for(var i=0; i<v.length; i++){ if(v[i].lang.indexOf('es')===0){ vozElegida = v[i]; return; } } vozElegida = v[0]; } };
  loadVoices(); speechSynthesis.onvoiceschanged = loadVoices;
}
function hablar(texto) {
  if (!vozDisponible) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(texto);
    u.lang = 'es-ES'; if (vozElegida) u.voice = vozElegida;
    u.onstart = function() { document.getElementById('face').classList.add('speaking'); };
    u.onend = function() { document.getElementById('face').classList.remove('speaking'); };
    u.onerror = function() { document.getElementById('face').classList.remove('speaking'); };
    
    // Truco para forzar el audio en tablets y móviles
    speechSynthesis.speak(u);
    if (window.speechSynthesis.paused) { window.speechSynthesis.resume(); }

function decirHola() {

function contarChisteVoz() {

}

// ---------- MODO DESCANSO (Luna) ----------
function toggleSleep() {

// ---------- PROTECTOR DE PANTALLA (Fotos) ----------
var timerFotos;
var fotos = document.querySelectorAll('.screensaver img');
var fotoIdx = 0;

function iniciarProtector() {
  document.getElementById('screensaver').classList.add('active');
  fotoIdx = 0;
  fotos.forEach(f => f.classList.remove('active'));
  fotos[fotoIdx].classList.add('active');
  
  clearInterval(timerFotos);
  timerFotos = setInterval(function() {
    fotos[fotoIdx].classList.remove('active');
    fotoIdx = (fotoIdx + 1) % fotos.length;
    fotos[fotoIdx].classList.add('active');
  }, 10000); // 10 segundos
}

function despertarPantalla() {
  document.getElementById('screensaver').classList.remove('active');
  clearInterval(timerFotos);
  resetearInactividad(); // Reinicia el contador
}

var tiempoInactivo;

function parseICSDate(str) {
  if (!str) return null; str = str.trim();
  if (str.length === 8) return { date: new Date(parseInt(str.substr(0,4),10), parseInt(str.substr(4,2),10)-1, parseInt(str.substr(6,2),10)), allDay: true };
  if (str.length >= 15) {
    var y = parseInt(str.substr(0,4),10), m = parseInt(str.substr(4,2),10)-1, d = parseInt(str.substr(6,2),10), hh = parseInt(str.substr(9,2),10), mm = parseInt(str.substr(11,2),10);
    if (str.charAt(str.length - 1) === 'Z') return { date: new Date(Date.UTC(y, m, d, hh, mm)), allDay: false };
    return { date: new Date(y, m, d, hh, mm), allDay: false };
  }
  return null;
}
function parsearICS(texto) {
  var eventos = [], lines = texto.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n'), dentro = false, actual = {};
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l === 'BEGIN:VEVENT') { dentro = true; actual = {}; }
    else if (l === 'END:VEVENT') { if (actual.start && actual.summary) eventos.push(actual); dentro = false; }
    else if (dentro) {
      if (l.indexOf('STATUS:CANCELLED') === 0) actual.cancelado = true;
      if (l.indexOf('DTSTART') === 0) { var p = parseICSDate(l.split(':')[1]); if(p) { actual.start = p.date; actual.allDay = p.allDay; } }
      if (l.indexOf('SUMMARY:') === 0) actual.summary = l.substr(8).trim().replace(/\\,/g, ',');
    }
  }
  return eventos;
}
var eventosCache = [];
function cargarCalendario() {
  fetch(ICS_URL, { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(texto) {
    eventosCache = parsearICS(texto).filter(function(e) { return !e.cancelado; });
    eventosCache.sort(function(a, b) { return a.start - b.start; });
    renderizarEventos(); comprobarAvisos();
  }).catch(function() { document.getElementById('events-list').innerHTML = '<li class="empty">No se pudo cargar</li>'; });
}
function renderizarEventos() {
  var lista = document.getElementById('events-list'), ahora = new Date(), proximos = [];
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i], fin = new Date(ev.start.getTime());
    if (ev.allDay) fin.setHours(23, 59, 59); else fin.setHours(fin.getHours() + 1);
    if (fin >= ahora) { proximos.push(ev); if (proximos.length >= 5) break; }
  }
  if (proximos.length === 0) { lista.innerHTML = '<li class="empty">Sin eventos próximos</li>'; return; }
  var html = '';
  for (var j = 0; j < proximos.length; j++) {
    var e = proximos[j], d = e.start, h = pad(d.getHours()) + ':' + pad(d.getMinutes()), dia = DIAS_CORTOS[d.getDay()] + ' ' + d.getDate();
    if (e.allDay) h = 'Todo el día';
    else if (d.toDateString() === ahora.toDateString()) dia = 'Hoy';
    else { var m = new Date(ahora); m.setDate(m.getDate()+1); if(d.toDateString() === m.toDateString()) dia = 'Mañana'; }
    html += '<li class="event-item' + (e.allDay ? ' all-day' : '') + '"><div class="event-time"><span class="day">'+dia+'</span>'+h+'</div><div class="event-title">'+e.summary+'</div></li>';
  }
  lista.innerHTML = html;
}

var avisosHechos = {};
function comprobarAvisos() {
  if (!vozDisponible) return;
  var ahora = new Date(), umbralMs = AVISO_MIN * 60 * 1000;
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i], diff = ev.start.getTime() - ahora.getTime();
    if (!ev.allDay && diff > 0 && diff <= umbralMs) {
      var c = ev.start.getTime() + '|' + ev.summary + '_pre';
      if (!avisosHechos[c]) { avisosHechos[c] = true; hablar('En ' + Math.round(diff/60000) + ' minutos: ' + ev.summary); }
    }
    if (!ev.allDay && diff <= 0 && diff > -60000) {
      var c2 = ev.start.getTime() + '|' + ev.summary + '_cero';
      if (!avisosHechos[c2]) { avisosHechos[c2] = true; hablar('Atención, es la hora de: ' + ev.summary); }
    }
  }
}
