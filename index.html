function pad(n) { return n < 10 ? '0' + n : '' + n; }

// ===== TTS NATIVO (speechSynthesis) =====
function cargarVoces() {
  if (!window.speechSynthesis) return;
  var voces = window.speechSynthesis.getVoices();
  if (voces && voces.length > 0) {
    vocesCargadas = true;
    for (var i = 0; i < voces.length; i++) {
      if (voces[i].lang && voces[i].lang.toLowerCase().indexOf('es') === 0) {
        vozEspanol = voces[i];
        break;
      }
    }
    ttsDisponible = true;
  }
}
if (window.speechSynthesis) {
  cargarVoces();
  window.speechSynthesis.onvoiceschanged = cargarVoces;
  setTimeout(cargarVoces, 1000);
  setTimeout(cargarVoces, 3000);
}

function limpiarTextoParaTTS(texto) {
  return texto.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F900}-\u{1F9FF}\u{1F1E0}-\u{1F1FF}]/gu, "");
}

function quitarCaraHablando() {
  var face = document.getElementById('face');
  if (face) face.classList.remove('speaking');
}

function hablar(texto) {
  var limpio = limpiarTextoParaTTS(texto);
  if (!limpio || !limpio.trim()) return;

  // === 1) speechSynthesis nativo (Android TTS) ===
  if (window.speechSynthesis && ttsDisponible) {
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(limpio);
      u.lang = 'es-ES';
      u.rate = 0.95;
      u.pitch = 1.0;
      u.volume = 1.0;
      if (vozEspanol) u.voice = vozEspanol;

      var face = document.getElementById('face');
      u.onstart = function() { if (face) face.classList.add('speaking'); };
      u.onend = quitarCaraHablando;
      u.onerror = function(e) {
        quitarCaraHablando();
        console.warn('speechSynthesis error, probando fallback:', e);
        hablarFallback(limpio);
      };
      window.speechSynthesis.speak(u);
      return;
    } catch(e) {
      console.warn('speechSynthesis catch:', e);
      quitarCaraHablando();
    }
  }

  // === 2) Fallback: Google Translate TTS ===
  hablarFallback(limpio);
}

var audioActual = null;
function hablarFallback(texto) {
  try {
    if (audioActual) {
      audioActual.pause();
      audioActual.currentTime = 0;
      audioActual = null;
    }
    var url = "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q=" + encodeURIComponent(texto);
    audioActual = new Audio(url);
    var face = document.getElementById('face');
    audioActual.onplay = function() { if (face) face.classList.add('speaking'); };
    audioActual.onended = quitarCaraHablando;
    audioActual.onerror = function() {
      quitarCaraHablando();
      console.warn('Fallback Google TTS también falló');
    };
    var p = audioActual.play();
    if (p && p.catch) p.catch(function(e) { console.warn('Autoplay bloqueado:', e); });
  } catch(e) {
    console.warn('hablarFallback catch:', e);
  }
}

// ===== RELOJ =====
function actualizarReloj() {
  var ahora = new Date();
  document.getElementById('clock').innerHTML = pad(ahora.getHours()) + ':' + pad(ahora.getMinutes()) + '<span class="seconds">:' + pad(ahora.getSeconds()) + '</span>';
  document.getElementById('date').textContent = DIAS_SEMANA[ahora.getDay()] + ', ' + ahora.getDate() + ' de ' + MESES[ahora.getMonth()];
  var face = document.getElementById('face'), h = ahora.getHours();
  face.classList.remove('manana', 'tarde', 'noche');
  if (h >= 6 && h < 12) face.classList.add('manana');
  else if (h >= 12 && h < 20) face.classList.add('tarde');
  else face.classList.add('noche');
  var hoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
  var meta = new Date(EVENTO_FUTURO.anio, EVENTO_FUTURO.mes, EVENTO_FUTURO.dia);
  var diffDias = Math.ceil((meta - hoy) / (1000 * 60 * 60 * 24));
  if (diffDias > 0) document.getElementById('countdown').textContent = 'Faltan ' + diffDias + ' días para ' + EVENTO_FUTURO.texto;
}

}

function contarChisteVoz() {
  if (chisteActual) hablar(chisteActual);
}

function nuevoChiste() {
  var nuevo = chisteActual;
  var intentos = 0;
  // Evitar que salga el mismo chiste seguido
  while (nuevo === chisteActual && CHISTES.length > 1 && intentos < 10) {
    nuevo = CHISTES[Math.floor(Math.random() * CHISTES.length)];
    intentos++;
  }
  chisteActual = nuevo;
  document.getElementById('chiste-box').textContent = chisteActual;
  document.getElementById('dato-box').textContent = "💡 ¿Sabías que...? " + DATOS_CURIOSOS[Math.floor(Math.random() * DATOS_CURIOSOS.length)];
  hablar(chisteActual);
}

function mostrarExtras() {
  chisteActual = CHISTES[Math.floor(Math.random() * CHISTES.length)];
  document.getElementById('chiste-box').textContent = chisteActual;
  document.getElementById('dato-box').textContent = "💡 ¿Sabías que...? " + DATOS_CURIOSOS[Math.floor(Math.random() * DATOS_CURIOSOS.length)];
}

// ===== SUEÑO / PANTALLA =====
function toggleSleep() {
  document.body.classList.toggle('sleep-mode');
  if (!document.body.classList.contains('sleep-mode')) decirHola();
}

var timerFotos, fotos = document.querySelectorAll('.screensaver img'), fotoIdx = 0;
function iniciarProtector() {
  document.getElementById('screensaver').classList.add('active');
  fotoIdx = 0;
  fotos.forEach(function(f) { f.classList.remove('active'); });
  if (fotos[fotoIdx]) fotos[fotoIdx].classList.add('active');
  clearInterval(timerFotos);
  timerFotos = setInterval(function() {
    if (!fotos.length) return;
    fotos[fotoIdx].classList.remove('active');
    fotoIdx = (fotoIdx + 1) % fotos.length;
    fotos[fotoIdx].classList.add('active');
  }, 30000);
}

function despertarPantalla() {
  document.getElementById('screensaver').classList.remove('active');
  clearInterval(timerFotos);
  resetearInactividad();
}

var tiempoInactivo;
function resetearInactividad() {
  clearTimeout(tiempoInactivo);
  tiempoInactivo = setTimeout(iniciarProtector, 5 * 60 * 1000);
}
document.addEventListener('touchstart', resetearInactividad, { passive: true });
document.addEventListener('mousemove', resetearInactividad, { passive: true });
document.addEventListener('click', resetearInactividad, { passive: true });

// ===== BATERÍA =====
function actualizarBateria() {
  if (navigator.getBattery) {
    navigator.getBattery().then(function(battery) {
      function updateAll() {
        var level = Math.round(battery.level * 100);
        var bar = document.getElementById('battery-level'), text = document.getElementById('battery-text');
        if (bar && text) {
          bar.style.width = level + '%'; text.textContent = level + '%';
          if (level > 50) bar.style.background = '#4ade80';
          else if (level > 20) bar.style.background = '#fbbf24';
          else bar.style.background = '#ef4444';
        }
      }
      updateAll();
      battery.addEventListener('levelchange', updateAll);
    });
  }
}

// ===== CLIMA =====
var WMO_CODES = {0: 'Despejado', 1: 'Mayormente despejado', 2: 'Parcialmente nublado', 3: 'Nublado', 45: 'Niebla', 48: 'Niebla helada', 51: 'Llovizna', 53: 'Llovizna', 55: 'Llovizna fuerte', 61: 'Lluvia ligera', 63: 'Lluvia', 65: 'Lluvia fuerte', 71: 'Nieve ligera', 73: 'Nieve', 75: 'Nieve fuerte', 80: 'Chubascos', 81: 'Chubascos', 82: 'Chubascos fuertes', 95: 'Tormenta', 96: 'Tormenta con granizo', 99: 'Tormenta fuerte'};
function actualizarClima() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON + '&current_weather=true&hourly=precipitation_probability,weathercode&timezone=auto', { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data && data.current_weather) {
        document.getElementById('temp').textContent = Math.round(data.current_weather.temperature);
        document.getElementById('weather-desc').textContent = WMO_CODES[data.current_weather.weathercode] || 'Despejado';
        document.getElementById('city-name').textContent = CIUDAD;
        var alertaBox = document.getElementById('weather-alert'), vaALLover = false;
        if (data.hourly && data.hourly.precipitation_probability) {
          var horaActual = new Date().getHours();
          for (var i = horaActual; i < horaActual + 8; i++) {
            if (data.hourly.precipitation_probability[i] > 50) { vaALLover = true; break; }
          }
        }
        if (vaALLover) { alertaBox.textContent = "🌧️ Va a llover, ¡no olvides el paraguas!"; alertaBox.style.display = 'block'; }
        else { alertaBox.style.display = 'none'; }
      }
    }).catch(function() {});
}

// ===== CALENDARIO =====
function parseICSDate(str) {
  if (!str) return null; str = str.trim();
  if (str.length === 8) return { date: new Date(parseInt(str.substr(0,4),10), parseInt(str.substr(4,2),10)-1, parseInt(str.substr(6,2),10)), allDay: true };
  if (str.length >= 15) {
    var y = parseInt(str.substr(0,4),10), m = parseInt(str.substr(4,2),10)-1, d = parseInt(str.substr(6,2),10), hh = parseInt(str.substr(9,2),10), mm = parseInt(str.substr(11,2),10);
    if (str.charAt(str.length - 1) === 'Z') return { date: new Date(Date.UTC(y, m, d, hh, mm)), allDay: false };
    return { date: new Date(y, m, d, hh, mm), allDay: false };
  }
  return null;
}
function parsearICS(texto) {
  var eventos = [], lines = texto.replace(/\r\n/g, '\n').replace(/\n[ \t]/g, '').split('\n'), dentro = false, actual = {};
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i];
    if (l === 'BEGIN:VEVENT') { dentro = true; actual = {}; }
    else if (l === 'END:VEVENT') { if (actual.start && actual.summary) eventos.push(actual); dentro = false; }
    else if (dentro) {
      if (l.indexOf('STATUS:CANCELLED') === 0) actual.cancelado = true;
      if (l.indexOf('DTSTART') === 0) { var p = parseICSDate(l.split(':')[1]); if(p) { actual.start = p.date; actual.allDay = p.allDay; } }
      if (l.indexOf('SUMMARY:') === 0) actual.summary = l.substr(8).trim().replace(/\\,/g, ',');
    }
  }
  return eventos;
}
var eventosCache = [];
function cargarCalendario() {
  fetch(ICS_URL, { cache: 'no-store' }).then(function(r) { return r.text(); }).then(function(texto) {
    eventosCache = parsearICS(texto).filter(function(e) { return !e.cancelado; });
    eventosCache.sort(function(a, b) { return a.start - b.start; });
    renderizarEventos(); comprobarAvisos();
  }).catch(function() { document.getElementById('events-list').innerHTML = '<li class="empty">No se pudo cargar</li>'; });
}
function renderizarEventos() {
  var lista = document.getElementById('events-list'), ahora = new Date(), proximos = [];
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i], fin = new Date(ev.start.getTime());
    if (ev.allDay) fin.setHours(23, 59, 59); else fin.setHours(fin.getHours() + 1);
    if (fin >= ahora) { proximos.push(ev); if (proximos.length >= 5) break; }
  }
  if (proximos.length === 0) { lista.innerHTML = '<li class="empty">Sin eventos</li>'; return; }
  var html = '';
  for (var j = 0; j < proximos.length; j++) {
    var e = proximos[j], d = e.start, h = pad(d.getHours()) + ':' + pad(d.getMinutes()), dia = DIAS_CORTOS[d.getDay()] + ' ' + d.getDate();
    if (e.allDay) h = 'Todo el día';
    else if (d.toDateString() === ahora.toDateString()) dia = 'Hoy';
    else { var m = new Date(ahora); m.setDate(m.getDate()+1); if (d.toDateString() === m.toDateString()) dia = 'Mañana'; }
    html += '<li class="event-item' + (e.allDay ? ' all-day' : '') + '"><div class="event-time"><span class="day">'+dia+'</span>'+h+'</div><div class="event-title">'+e.summary+'</div></li>';
  }
  lista.innerHTML = html;
}
var avisosHechos = {};
function comprobarAvisos() {
  var ahora = new Date(), umbralMs = AVISO_MIN * 60 * 1000;
  for (var i = 0; i < eventosCache.length; i++) {
    var ev = eventosCache[i], diff = ev.start.getTime() - ahora.getTime();
    if (!ev.allDay && diff > 0 && diff <= umbralMs) {
      var c = ev.start.getTime() + '|' + ev.summary + '_pre';
      if (!avisosHechos[c]) { avisosHechos[c] = true; hablar('En ' + Math.round(diff/60000) + ' minutos: ' + ev.summary); }
    }
    if (!ev.allDay && diff <= 0 && diff > -60000) {
      var c2 = ev.start.getTime() + '|' + ev.summary + '_cero';
      if (!avisosHechos[c2]) { avisosHechos[c2] = true; hablar('Atención, es la hora de: ' + ev.summary); }
    }
  }
}

// ===== NOTAS =====
function cargarNotas() {
  var g = localStorage.getItem('panel_familiar_notas');
  if (g !== null) document.getElementById('notes').value = g;
}
function guardarNotas() {
  localStorage.setItem('panel_familiar_notas', document.getElementById('notes').value);
  var hint = document.getElementById('notes-hint');
  hint.textContent = 'Guardado ✓'; hint.classList.add('saved');
  setTimeout(function() { hint.textContent = 'Se guardan solas'; hint.classList.remove('saved'); }, 2000);
}

// ===== INICIO =====
function iniciar() {
  actualizarReloj(); setInterval(actualizarReloj, 1000);
  actualizarBateria();
  actualizarClima(); setInterval(actualizarClima, 10 * 60 * 1000);
  cargarCalendario(); setInterval(cargarCalendario, 5 * 60 * 1000);
  setInterval(comprobarAvisos, 30 * 1000);
  cargarNotas();
  document.getElementById('notes').addEventListener('input', guardarNotas);
  mostrarExtras();
  resetearInactividad();

  // Desbloquear audio en el primer toque (Fully Kiosk / WebView)
  var desbloqueado = false;
  function desbloquearAudio() {
    if (desbloqueado) return;
    desbloqueado = true;
    primeTTS();
    cargarVoces();
    document.removeEventListener('touchstart', desbloquearAudio);
    document.removeEventListener('click', desbloquearAudio);
  }
  document.addEventListener('touchstart', desbloquearAudio, { passive: true });
  document.addEventListener('click', desbloquearAudio);

  // Reintentar cargar voces cuando vuelva a estar visible
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) cargarVoces();
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar); else iniciar();
